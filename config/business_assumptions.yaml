# Tham số giả định nghiệp vụ mặc định cho Lớp 3 (BA Reskilling ROI Simulator)
# Người dùng (CHRO / CFO / Business Analyst) có thể hiệu chỉnh trực tiếp qua cơ chế Human-in-the-Loop trên Streamlit.

enterprise_profile:
  company_name_template: "Doanh nghiệp Mẫu Việt Nam (Dịch vụ / Tài chính / BPO)"
  headcount_default: 1000
  working_hours_per_month: 168
  currency: "VND"

