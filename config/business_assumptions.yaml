financial_assumptions:
  horizon_months: 36                     # Khung thời gian đánh giá dòng tiền (3 năm)
  discount_rate_annual: 0.10             # Chi phí sử dụng vốn / tỷ lệ chiết khấu năm (10%/năm)
  reskilling_cost_vnd: 12000000          # Chi phí tái đào tạo bình quân một nhân sự (VNĐ)
  ai_seat_cost_vnd: 550000               # Chi phí bản quyền công cụ AI / nhân sự / tháng (VNĐ)
  change_management_overhead_pct: 0.15   # Chi phí quản trị thay đổi & tích hợp quy trình (% trên tổng chi phí đào tạo)
  replacement_cost_months_salary: 4.0    # Chi phí đền bù nghỉ việc + tuyển mới + thời gian làm quen (tính theo tháng lương)
  realization_rate: 0.50                 # Tỷ lệ giờ tiết kiệm thực tế chuyển hóa thành giá trị kinh doanh (thận trọng 50%)
  productivity_ramp_months: 3            # Số tháng làm quen công cụ trước khi đạt năng suất ổn định
  annual_attrition_rate: 0.18            # Tỷ lệ nghỉ việc tự nhiên hàng năm (18%/năm - thực tế ngành BPO/Tech VN)
  backfill_retrain_cost_ratio: 0.75      # Chi phí đào tạo lại cho nhân sự tuyển bù người nghỉ việc (tỷ lệ trên reskilling_cost)
  annual_refresh_cost_pct: 0.15          # Chi phí cập nhật kỹ năng & công cụ AI hàng năm (% trên chi phí đào tạo năm đầu)
  handover_disruption_months_per_cut: 1.5 # Tổn thất bàn giao quy trình tương ứng với quỹ lương bị cắt giảm (tháng lương bị cắt)
  untrained_ai_realization_ratio: 0.35   # Hiệu suất khai thác AI tự học của nhân sự ở lại khi KHÔNG tái đào tạo bài bản (35%)
  survivor_ai_seat_coverage: 0.50        # Tỷ trọng nhân sự ở lại trong phương án Cut & Replace được cấp license AI (50%)
  monte_carlo_corr_adoption_realization: 0.65 # Tương quan đồng biến (Gaussian Copula) giữa tốc độ áp dụng & hiện thực hóa
  monte_carlo_corr_realization_attrition: -0.35 # Tương quan nghịch giữa hiện thực hóa năng suất & tỷ lệ nghỉ việc

adoption_scenarios:
  conservative:
    label: "Thận trọng (Conservative)"
    adoption_multiplier: 0.35
    description: "Áp dụng AI thí điểm tại các tác vụ văn bản/báo cáo chuẩn hóa, kiểm duyệt chặt."
  base:
    label: "Cơ sở (Base Case)"
    adoption_multiplier: 0.60
    description: "Tích hợp AI vào quy trình làm việc chuẩn kèm đào tạo lại có trọng điểm."
  accelerated:
    label: "Tăng tốc (Accelerated)"
    adoption_multiplier: 0.85
    description: "Triển khai đồng bộ AI Agents + tái thiết kế quy trình liên phòng ban."

